<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de usuarios de Github</title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center p-8 font-sans justify-center">

    <label for="campoBuscarUsuario" class="text-sm font-medium text-gray-700 mb-2">Busca un usuario</label>

    <input type="text" id="campoBuscarUsuario" class="border border-gray-300 rounded-md px-3 py-2  w-80 focus:outline-none focus:ring-2 focus:ring-gray-400" placeholder="ej. octocat">

    <button id="botonBuscarUsuario" class="mt-3 bg-gray-900 text-white px-4 py-2 rounded-md font-medium hover:bg-gray-700 cursor-pointer">Buscar</button>

    <div id="contenedorResultados"></div>

    <script>
        //Variables del input y boton de busqueda de usuario
        const campoBuscarUsuario = document.querySelector("#campoBuscarUsuario");
        const botonBuscarUsuario = document.querySelector("#botonBuscarUsuario");

        //Contenedor que tendra dentro toda la informacion del usuario
        const contenedorResultados = document.querySelector("#contenedorResultados");

        //Funcion para buscar al usuario
        async function buscarUsuario() {
            try {
                contenedorResultados.className = "";

                //Validacion para que no haya espacios en blanco o escritura en blanco dentro del campo
                if (campoBuscarUsuario.value.trim() == ""){
                    contenedorResultados.innerHTML = "";
                    const alertaNoEncontrado = document.createElement("p");
                    alertaNoEncontrado.className = "text-gray-500 text-sm mt-6";
                    alertaNoEncontrado.textContent = "Ingresa el nombre de un usuario";
                    contenedorResultados.appendChild(alertaNoEncontrado);
                    return;
                }

                //Estado Buscando...
                contenedorResultados.innerHTML = "";
                const mensajeEspera = document.createElement("p");
                mensajeEspera.className = "text-gray-500 text-sm mt-6";
                mensajeEspera.textContent = "Buscando...";
                contenedorResultados.appendChild(mensajeEspera);

                //Consumir la API de github
                const respuesta = await fetch("https://api.github.com/users/" + campoBuscarUsuario.value);
                const datos = await respuesta.json();

                //Limpiamos el contenedor
                contenedorResultados.innerHTML = "";

                //Validacion por si se ingresa un usuario que no existe
                if (!respuesta.ok){
                    const mensajeAlerta = document.createElement("p");
                    mensajeAlerta.className = "text-amber-600 text-sm font-medium mt-6";
                    mensajeAlerta.textContent = "Usuario no encontrado"
                    contenedorResultados.appendChild(mensajeAlerta);
                    campoBuscarUsuario.value = "";
                    return;
                }

                //Estilamos el contenedor de los datos del usuario
                contenedorResultados.className = "bg-white border border-gray-200 rounded-lg shadow-sm p-6 mt-6 w-80 flex flex-col items-center";
                
                //Pintamos la pagina con los datos que nos arroje la API
                const avatarUsuario = document.createElement("img");
                const nombreUsuario = document.createElement("h3");
                const bioUsuario = document.createElement("p");
                const reposUsuario = document.createElement("p");
                const seguidoresUsuario = document.createElement("p");
                contenedorResultados.appendChild(avatarUsuario);
                contenedorResultados.appendChild(nombreUsuario);
                contenedorResultados.appendChild(bioUsuario);
                contenedorResultados.appendChild(reposUsuario);
                contenedorResultados.appendChild(seguidoresUsuario);

                //Estilamos el contenido dentro del contenedor una vez los hayamos creado
                avatarUsuario.className = "w-24 h-24 rounded-full border-2 border-gray-200";
                nombreUsuario.className = "text-xl font-semibold text-gray-900 mt-4";
                bioUsuario.className = "text-sm text-gray-600 text-center mt-2";
                reposUsuario.className ="text-sm text-gray-500 mt-2";
                seguidoresUsuario.className ="text-sm text-gray-500 mt-2";
                
                //Obtenemos los datos y los asignamos
                avatarUsuario.src = datos.avatar_url;
                avatarUsuario.alt = "Avatar del usuario";
                nombreUsuario.textContent = datos.name ?? "Sin nombre de usuario"; //Se usa el operador de coalescencia nula (??) para manejar datos null o undefined
                bioUsuario.textContent = datos.bio ?? "Sin biografía"; 
                reposUsuario.textContent = datos.public_repos + " Repositorios";
                seguidoresUsuario.textContent = datos.followers + " Seguidores";
                campoBuscarUsuario.value = "";
                
            } catch (error) {
                //Limpiamos el contenedor y mostramos el error
                contenedorResultados.innerHTML = "";
                const mensajeErrorConexion = document.createElement("p");
                mensajeErrorConexion.className = "text-red-600 text-sm font-medium mt-6";
                mensajeErrorConexion.textContent = "Error: " + error;
                contenedorResultados.appendChild(mensajeErrorConexion);
            }
        }
        
        botonBuscarUsuario.addEventListener("click", buscarUsuario);

    </script>
</body>
</html>
